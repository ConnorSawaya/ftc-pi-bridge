# Keep the log on the SD card (Raspberry Pi OS keeps it in memory only), so a freeze can be
# looked at after the watchdog restarts the Pi. Capped so it never fills the card.
# Written to the card every 30 s, not the default 5 min: pulling the cable loses whatever isn't
# written yet (it lost the last 3 minutes before a dead USB link on 2026-10-23).
[Journal]
Storage=persistent
SystemMaxUse=50M
SyncIntervalSec=30s
